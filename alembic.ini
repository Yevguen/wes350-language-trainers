# A generic, single database configuration.

[alembic]
# Path to migration scripts, relative to the location of this file
script_location = %(here)s/alembic
sqlalchemy.url = sqlite:///./test.db

# Add local Python paths if needed
prepend_sys_path = .

# Use OS path separator when joining multiple version paths
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
